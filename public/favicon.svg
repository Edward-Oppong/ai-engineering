<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" fill="none">
  <!-- Dark warm background -->
  <rect width="32" height="32" rx="6" fill="#1c1b1a"/>
  
  <!-- Neural network nodes — amber accent -->
  <!-- Top node -->
  <circle cx="16" cy="5" r="2.2" fill="#c48c66"/>
  <!-- Mid-left node -->
  <circle cx="6" cy="14" r="2.2" fill="#c48c66"/>
  <!-- Mid-right node -->
  <circle cx="26" cy="14" r="2.2" fill="#c48c66"/>
  <!-- Bottom-left node -->
  <circle cx="9" cy="25" r="2.2" fill="#9e5b2d"/>
  <!-- Bottom-right node -->
  <circle cx="23" cy="25" r="2.2" fill="#9e5b2d"/>
  <!-- Center node -->
  <circle cx="16" cy="16" r="2.8" fill="#e0b08e"/>

  <!-- Connections -->
  <line x1="16" y1="5" x2="6" y2="14" stroke="#c48c66" stroke-width="1" stroke-opacity="0.7"/>
  <line x1="16" y1="5" x2="26" y2="14" stroke="#c48c66" stroke-width="1" stroke-opacity="0.7"/>
  <line x1="16" y1="5" x2="16" y2="16" stroke="#c48c66" stroke-width="1" stroke-opacity="0.5"/>
  <line x1="6" y1="14" x2="16" y2="16" stroke="#c48c66" stroke-width="1" stroke-opacity="0.7"/>
  <line x1="26" y1="14" x2="16" y2="16" stroke="#c48c66" stroke-width="1" stroke-opacity="0.7"/>
  <line x1="6" y1="14" x2="9" y2="25" stroke="#9e5b2d" stroke-width="1" stroke-opacity="0.7"/>
  <line x1="26" y1="14" x2="23" y2="25" stroke="#9e5b2d" stroke-width="1" stroke-opacity="0.7"/>
  <line x1="16" y1="16" x2="9" y2="25" stroke="#9e5b2d" stroke-width="1" stroke-opacity="0.6"/>
  <line x1="16" y1="16" x2="23" y2="25" stroke="#9e5b2d" stroke-width="1" stroke-opacity="0.6"/>
  <line x1="9" y1="25" x2="23" y2="25" stroke="#9e5b2d" stroke-width="1" stroke-opacity="0.5"/>
  <line x1="6" y1="14" x2="23" y2="25" stroke="#9e5b2d" stroke-width="0.7" stroke-opacity="0.3"/>
  <line x1="26" y1="14" x2="9" y2="25" stroke="#9e5b2d" stroke-width="0.7" stroke-opacity="0.3"/>
</svg>
